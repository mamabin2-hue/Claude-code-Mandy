name: 部署到 GitHub Pages

on:
  push:
    branches: [claude/usage-availability-7mDG3, main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 安裝 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安裝套件
        run: npm ci

      - name: 建置
        run: npm run build

      - name: 上傳到 GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 發布
        id: deployment
        uses: actions/deploy-pages@v4
