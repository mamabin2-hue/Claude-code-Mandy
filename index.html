<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Claude-code-Mandy/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="甲衛複習" />
    <title>職業衛生管理甲級｜技術士考試輔助</title>
    <link rel="manifest" href="/Claude-code-Mandy/manifest.json" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        // controllerchange fires when a new SW takes control (skipWaiting + clients.claim)
        // This is the definitive signal: new version is live → reload once
        let reloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!reloading) {
            reloading = true;
            window.location.reload();
          }
        });

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/Claude-code-Mandy/sw.js')
            .then(reg => {
              // Force-check for a new SW on every single page open
              reg.update();
            });
        });
      }
    </script>
  </body>
</html>
